# Drop-in for netplan's generated netplan-wpa-wlan0.service.
# Installs to /etc/systemd/system/netplan-wpa-wlan0.service.d/10-rfsurvey-nobtm.conf
#
# Netplan regenerates /run/netplan/wpa-wlan0.conf at every boot and cannot
# express disable_btm, so it is written back in immediately before the
# supplicant starts. See systemd/rfsurvey-wifi-nobtm for what it does and why.
#
# The leading "-" on every line of ours is deliberate: if the script is missing
# or misbehaves, the supplicant still starts. Losing disable_btm costs the
# steering fix; blocking wpa_supplicant would cost the only network this deck has.
[Service]
ExecStartPre=-/home/firestarss/rfsurvey/systemd/rfsurvey-wifi-nobtm /run/netplan/wpa-wlan0.conf

# Reload too: `netplan apply` can regenerate the file and reload rather than
# restart, and a reload would otherwise quietly drop the setting. ExecReload has
# to be cleared and rebuilt to run anything before netplan's own line, which is
# copied here verbatim from netplan 1.2 — re-check it after a netplan upgrade.
# rfsurvey-netwatch also re-asserts the setting in the running supplicant every
# minute, so a missed reload is corrected within 60 s either way.
ExecReload=
ExecReload=-/home/firestarss/rfsurvey/systemd/rfsurvey-wifi-nobtm /run/netplan/wpa-wlan0.conf
ExecReload=/sbin/wpa_cli -i wlan0 reconfigure
