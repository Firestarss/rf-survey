# Festival deployment profile
#
# A profile answers "where am I and what do I care about." It is config, not code.
# Fields the software cannot read (antenna, attenuator) are recorded anyway — six months
# from now, "why is this run 10 dB down on that one" should be answered by this file
# rather than by memory.
#
# Numeric underscores parse correctly under PyYAML (YAML 1.1). If this ever moves to a
# YAML 1.2 parser, they become strings — drop them then.

name: festival
description: FRS, GMRS, Part 90 business, plus 2 m and 70 cm ham

receivers:

  uhf:
    # Measured Phase 1, 2026-08-26. SoapySDR spells it lowercase and without the
    # 0x that airspy_info prints; matching is case-insensitive and tolerates the
    # prefix, verified against the hardware, so either form selects this radio.
    # A serial that matches nothing is refused rather than opening whatever is
    # attached — which is what makes addressing by serial worth doing.
    serial: 637862dc2e4c6dd7
    mode: parked
    center_hz: 466_000_000        # covers 461–471: all FRS, GMRS, UHF dots and stars
    sample_rate: 10_000_000
    # STILL PROVISIONAL and known to be too low — step 11 sets it, and step 11
    # needs the antenna. Measured 2026-08-26: this is an overall 0-45 dB filling
    # LNA, then MIX, then VGA, and the receiver is ADC-noise-limited below ~36,
    # so 12 is LNA-only and the least sensitive useful setting there is. A
    # handheld ten feet away read 9.6 dB SNR here and 48.6 dB at gain 42.
    gain: 12
    # Measured Phase 1, 2026-08-26, against three independent references: an FRS
    # handheld across all 7 channels (-0.644), a licensed transmitter on exactly
    # 464.000000 MHz (-0.65), and a tinySA Ultra generator (-0.41, the outlier —
    # its own output is +0.21 ppm high, which is why three references and not one).
    # Sign: POSITIVE means signals read low by this much, and this value corrects
    # them. Verified on hardware — +0.64 moves a known carrier to within 96 Hz,
    # -0.64 doubles the error to -576 Hz.
    # Applied to the tune request, not via setFrequencyCorrection: SoapyAirspy
    # reports hasFrequencyCorrection() == False and silently ignores it.
    ppm: 0.64
    attenuator_db: 20             # 2x 10 dB stacked until the 20 dB pads arrive
    antenna: null                 # TODO: record what is actually screwed on
    usb_bus: 4                    # Bus 004 Port 1, xhci-hcd, 480M. vhf must not
                                  # land on this one — confirm with lsusb -t

  vhf:
    serial: null                  # TODO Phase 5
    mode: rotating
    dwell_seconds: 180
    sample_rate: 10_000_000
    gain: 12                      # TODO Phase 5
    ppm: 0.0                      # TODO Phase 5
    attenuator_db: 20
    antenna: null
    usb_bus: null
    windows:
      - {center_hz: 446_000_000, label: "70cm ham"}
      - {center_hz: 146_000_000, label: "2m ham"}
      # 154.950 is the midpoint of 151.505–158.400, the full span of VHF business
      # and MURS channels. Covers all 14 even at a conservative 8.5 MHz usable
      # bandwidth, with 800 kHz of edge margin. Nothing sits on the centre itself.
      # Was 153.200, which missed the 158.400 itinerant by 200 kHz.
      - {center_hz: 154_950_000, label: "MURS + VHF business"}

# Thresholds below are set from synthetic signals and are provisional.
# Do not tune them until there are real signals to tune against.
detection:
  on_db: 10.0
  off_db: 6.0
  min_duration_s: 0.12
  hang_s: 0.30

storage:
  db_path: data/survey.sqlite
  audio_retention_days: 30
  iq_retention_days: 7          # largest and least valuable — delete first
  spectrum_retention_days: 90
  metadata_retention_days: null # never delete

# Known gap, deliberately accepted for now: the 451.800/456.800 itinerant repeater
# pair falls outside every window above. Reaching it needs a fourth rotation window
# near 454 MHz, which costs dwell time on the three that exist. Revisit after the
# first real deployment shows whether that band is busy.

# Which services you may legally transmit on. Drives tier 4 — a channel you cannot
# key up on is not "contactable" however completely it has been characterised.
# Unlicensed services (FRS, MURS) always count and need not be listed here.
# Valid names match band_plan.service: ham2m, ham70cm, gmrs, part90.
# FRS needs no licence — it is licensed by rule — so it is never listed here and
# always counts. Only services requiring a licence go in this list.
operator:
  licences: [gmrs, ham2m, ham70cm]
